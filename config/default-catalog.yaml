# BramhaShiv AI default model catalog.
# Scores are 0-10 (how strong this model is on this trait).
# Edit freely; hot-reloaded on save.
#
# Model IDs MUST match what OpenCode's `opencode models <provider>` lists.
# If you add/rename a provider model, verify with that command first.

